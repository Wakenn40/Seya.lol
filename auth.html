<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>seya.lol - Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="seya_icon.svg" />
</head>
<body>

<div id="app">
  <div id="loading-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;display:none;"></div>
  <div class="grain" aria-hidden="true"></div>

  <section class="screen active" id="screen-auth" aria-label="Authentication">
    <div class="orb orb-1 orb--dim" aria-hidden="true"></div>
    <div class="orb orb-2 orb--dim" aria-hidden="true"></div>

    <div class="auth-box">
      <div class="auth-logo">seya.lol</div>
      <div id="discord-info" class="auth-discord-info" style="display:none;">
        <img id="discord-avatar" src="" alt="" style="width:48px;height:48px;border-radius:50%;margin-bottom:8px;">
        <p style="color:#888;font-size:14px;">Connected as <span id="discord-username" style="color:#5865F2;font-weight:bold;"></span></p>
      </div>
      <h2 class="auth-title" id="auth-title">Create account</h2>
      <p class="auth-sub" id="auth-sub">Choose a nickname - this will be your link</p>

      <div class="input-wrap">
        <label for="nickname-input">Nickname</label>
        <div class="input-prefix-wrap">
          <span class="input-prefix-text" aria-hidden="true">seya.lol/</span>
          <input
            type="text"
            id="nickname-input"
            class="input-field"
            placeholder="yourname"
            maxlength="30"
            autocomplete="username"
            spellcheck="false"
          />
        </div>
        <p class="input-hint" id="nickname-hint"></p>
      </div>

      <div class="input-wrap" id="password-wrap" style="display:none;">
        <label for="password-input">Password</label>
        <input
          type="password"
          id="password-input"
          class="input-field"
          placeholder="Create a password"
          minlength="4"
          autocomplete="new-password"
        />
        <p class="input-hint" id="password-hint"></p>
      </div>

      <div class="input-wrap" id="confirm-password-wrap" style="display:none;">
        <label for="confirm-password-input">Confirm Password</label>
        <input
          type="password"
          id="confirm-password-input"
          class="input-field"
          placeholder="Confirm your password"
          minlength="4"
          autocomplete="new-password"
        />
        <p class="input-hint" id="confirm-password-hint"></p>
      </div>

      <button class="btn btn-primary btn--full" id="auth-submit-btn">Continue →</button>

      <div class="auth-divider" id="auth-divider" style="display:none;">
        <span>or</span>
      </div>

      <button class="btn btn-ghost btn--full" id="discord-btn" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:8px;vertical-align:middle;">
          <path fill="#5865F2" d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        Continue with Discord
      </button>

      <p class="auth-switch">
        <span id="auth-switch-text">Already have an account?</span>
        <a href="#" class="auth-link" id="auth-switch-link" data-action="toggle-auth">Log in</a>
      </p>

      <button class="btn btn-ghost btn--sm auth-back" data-action="goto-landing">← Back</button>
    </div>

    <div class="auth-box" id="auth-2fa-box" style="display:none;">
      <div class="auth-logo">seya.lol</div>
      <h2 class="auth-title" style="font-size:22px;margin-bottom:4px;">Two-Factor Authentication</h2>
      <p class="auth-sub" style="font-size:13px;margin-bottom:20px;">Enter the code from your authenticator app</p>

      <div class="input-wrap">
        <input type="text" id="auth-2fa-input" class="input-field" placeholder="000000" maxlength="6" autocomplete="off" style="text-align:center;font-size:24px;letter-spacing:10px;font-family:monospace;" />
        <p class="input-hint" id="auth-2fa-hint"></p>
      </div>

      <button class="btn btn-primary btn--full" id="auth-2fa-submit-btn">Verify →</button>
      <button class="btn btn-ghost btn--sm auth-back" id="auth-2fa-back-btn" style="margin-top:8px;">← Back to login</button>
    </div>
  </section>

</div>

<div class="toast" id="toast" role="alert" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
